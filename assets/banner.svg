<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1500" height="500" fill="url(#bgGradient)" />
  <rect width="1500" height="500" fill="url(#grid)" />
  <rect width="1500" height="500" fill="url(#cyanGlow)" />
  <rect width="1500" height="500" fill="url(#indigoGlow)" />

  <!-- Abstract Circuit Traces -->
  <g stroke="url(#circuitGrad)" stroke-width="1.5" fill="none">
    <path d="M 0 110 L 260 110 L 310 160 L 520 160" />
    <path d="M 0 410 L 290 410 L 340 360 L 560 360" />
    <path d="M 860 90 L 1060 90 L 1100 130 L 1500 130" />
    <path d="M 820 430 L 1040 430 L 1090 380 L 1500 380" />
  </g>

  <!-- Circuit Trace Nodes -->
  <circle cx="310" cy="160" r="4" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="520" cy="160" r="3.5" fill="#818CF8" />
  <circle cx="340" cy="360" r="4" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="1100" cy="130" r="4" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="1090" cy="380" r="4" fill="#818CF8" filter="url(#glow)" />

  <!-- Left Content Area -->
  <!-- Status Badge -->
  <g transform="translate(80, 80)">
    <rect width="310" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10B981" />
    <circle cx="18" cy="16" r="8" fill="#10B981" fill-opacity="0.25" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">FULL STACK &amp; BACKEND ENG</text>
  </g>

  <!-- Name: BHARGAV BHAT -->
  <text x="80" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    BHARGAV BHAT
  </text>

  <!-- Subtitle: JAVA FULL STACK DEVELOPER -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#38BDF8" letter-spacing="1">
    JAVA FULL STACK DEVELOPER
  </text>

  <!-- Supporting line: SPRING BOOT | REACT | AI/ML -->
  <text x="80" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="1.5">
    SPRING BOOT  <tspan fill="#38BDF8">|</tspan>  REACT  <tspan fill="#38BDF8">|</tspan>  AI/ML
  </text>

  <!-- Concise Engineering Statement -->
  <text x="80" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B">
    Building scalable backend systems, clean microservices, and AI-augmented web applications.
  </text>

  <!-- Curated Tech Badges Bar -->
  <g transform="translate(80, 375)">
    <!-- Badge 1: Java 21 -->
    <rect x="0" y="0" width="94" height="36" rx="8" fill="#0F172A" stroke="#2563EB" stroke-width="1.2" />
    <text x="47" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#60A5FA">Java 21</text>

    <!-- Badge 2: Spring Boot -->
    <rect x="106" y="0" width="126" height="36" rx="8" fill="#0F172A" stroke="#16A34A" stroke-width="1.2" />
    <text x="169" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#4ADE80">Spring Boot</text>

    <!-- Badge 3: React.js -->
    <rect x="244" y="0" width="102" height="36" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
    <text x="295" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#38BDF8">React.js</text>

    <!-- Badge 4: MySQL -->
    <rect x="358" y="0" width="92" height="36" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.2" />
    <text x="404" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FBBF24">MySQL</text>

    <!-- Badge 5: Spring AI / RAG -->
    <rect x="462" y="0" width="138" height="36" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1.2" />
    <text x="531" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#C084FC">Spring AI / RAG</text>

    <!-- Badge 6: Docker -->
    <rect x="612" y="0" width="92" height="36" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
    <text x="658" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Docker</text>
  </g>

  <!-- Right Visual: Terminal Card -->
  <g transform="translate(890, 75)">
    <rect width="530" height="350" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect width="530" height="40" rx="14" fill="#0B0F19" />
    <rect y="26" width="530" height="14" fill="#0B0F19" />
    <line x1="0" y1="40" x2="530" y2="40" stroke="#1E293B" stroke-width="1" />
    
    <circle cx="24" cy="20" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="20" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="20" r="5.5" fill="#10B981" />
    
    <text x="265" y="25" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="12" fill="#64748B">DeveloperProfile.java</text>

    <g transform="translate(28, 70)" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13.5">
      <text y="0"><tspan fill="#C084FC">@RestController</tspan></text>
      <text y="26"><tspan fill="#C084FC">@RequestMapping</tspan><tspan fill="#94A3B8">(</tspan><tspan fill="#38BDF8">&quot;/api/v1/profile&quot;</tspan><tspan fill="#94A3B8">)</tspan></text>
      <text y="52"><tspan fill="#60A5FA">public class</tspan> <tspan fill="#F8FAFC">BhargavBhat</tspan> <tspan fill="#94A3B8">{</tspan></text>
      <text y="82" x="20"><tspan fill="#64748B">// Core Focus &amp; Stack</tspan></text>
      <text y="106" x="20"><tspan fill="#60A5FA">private final String</tspan> <tspan fill="#94A3B8">role = </tspan><tspan fill="#38BDF8">&quot;Java Full Stack Developer&quot;</tspan><tspan fill="#94A3B8">;</tspan></text>
      <text y="132" x="20"><tspan fill="#60A5FA">private final String</tspan> <tspan fill="#94A3B8">stack = </tspan><tspan fill="#38BDF8">&quot;Spring Boot &amp; React &amp; MySQL&quot;</tspan><tspan fill="#94A3B8">;</tspan></text>
      <text y="158" x="20"><tspan fill="#60A5FA">private final String</tspan> <tspan fill="#94A3B8">ai = </tspan><tspan fill="#38BDF8">&quot;Spring AI &amp; ChromaDB RAG&quot;</tspan><tspan fill="#94A3B8">;</tspan></text>
      <text y="190" x="20"><tspan fill="#C084FC">@GetMapping</tspan><tspan fill="#94A3B8">(</tspan><tspan fill="#38BDF8">&quot;/status&quot;</tspan><tspan fill="#94A3B8">)</tspan></text>
      <text y="216" x="20"><tspan fill="#60A5FA">public</tspan> <tspan fill="#F8FAFC">CareerStatus</tspan> <tspan fill="#38BDF8">getOpportunities</tspan><tspan fill="#94A3B8">() {</tspan></text>
      <text y="242" x="40"><tspan fill="#F43F5E">return</tspan> <tspan fill="#F8FAFC">CareerStatus</tspan><tspan fill="#94A3B8">.</tspan><tspan fill="#4ADE80">READY_FOR_HIRE</tspan><tspan fill="#94A3B8">;</tspan></text>
      <text y="268" x="20"><tspan fill="#94A3B8">}</tspan></text>
      <text y="294"><tspan fill="#94A3B8">}</tspan></text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="496" width="1500" height="4" fill="url(#primaryGlow)" />
</svg>